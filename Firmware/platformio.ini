; PlatformIO Project Configuration File

[common]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
	-DMQTT_MAX_PACKET_SIZE=768
	-DMQTT_KEEPALIVE=30
	-DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.1
	ESP32Async/ESPAsyncWebServer@^3.10.3
	ESP32Async/AsyncTCP@^3.4.10
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	teemuatlut/TMCStepper@^0.7.3
	; FastAccelStepper is vendored in lib/FastAccelStepper/ with KHpro patches (reduced BSS)
	https://github.com/Atlas-Scientific/Ezo_I2c_lib.git

; Serial upload (use for first flash or partition table changes)
[env:serial]
extends = common
upload_speed = 921600

; OTA upload (use after initial serial flash)
[env:ota]
extends = common
upload_protocol = espota
upload_port = khpro.local
upload_flags =
	--port=3232
extra_scripts = save_history.py

; Native host tests (run with: pio test -e native)
[env:native]
platform = native
build_flags =
	-DUNIT_TEST
	-I test/test_native/stubs
	-I include
	-std=gnu++17
test_framework = unity
test_filter = test_native
test_build_src = yes
; Native test build only compiles the two pure-C++ source files that
; have no Arduino/ESP32 dependencies. If you add new tests that need
; another src/ file, add it here AND keep test/test_native/src_build.cpp
; in sync (it #includes the same files explicitly as a redundancy).
build_src_filter =
	+<gran_analysis.cpp>
	+<scheduler.cpp>
	-<*>
lib_deps =
lib_ignore =
	PubSubClient
	ArduinoJson
	ESPAsyncWebServer
	AsyncTCP
	OneWire
	DallasTemperature
	TMCStepper
	FastAccelStepper
	Ezo_I2c_lib
